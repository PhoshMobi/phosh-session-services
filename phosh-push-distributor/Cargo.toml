[package]
name = "phosh-push-distributor"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.32"
oo7 = "0.5.0"
rand = { version = "0.10.1", features = ["thread_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.reqwest]
default-features = false
features = ["http2", "rustls"]
version = "0.13"

[dependencies.tokio]
default-features = false
features = ["fs", "io-std", "io-util", "macros", "rt", "signal", "sync", "time"]
version = "1.49"

[dependencies.zbus]
default-features = false
features = ["tokio"]
version = "5.13"

[dev-dependencies.tokio]
features = ["net"]
version = "1.49"
