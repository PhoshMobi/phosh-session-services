[package]
name = "phosh-os-updater"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["systemd-dbus-sysupdate1"]

systemd-dbus-sysupdate1 = []
# Use session but for easy testing
systemd-dbus-sysupdate1-session = []
# For systemd v262
#systemd-varlink-sysupdate = []

[dependencies]
async-channel = "2.5.0"
clap = { version = "4.6.1", features = ["derive"] }
futures-lite = "2.6.1"
futures-util = "0.3.32"
gettext-rs = "0.7.7"
log = "0.4.32"
phosh-session-services = { path = "../phosh-session-services" }
rand = { version = "0.10.1", features = ["thread_rng"] }
serde = "1.0.228"
serde_json = "1.0.150"
tracing-subscriber= { version = "0.3", features = ["env-filter"] }
zvariant = "5.12.0"

[dependencies.tokio]
default-features = false
features = ["fs", "macros", "rt", "sync", "time", "signal"]
version = "1.49"

[dependencies.zbus]
default-features = false
features = ["tokio"]
version = "5.13"
