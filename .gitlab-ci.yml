---
include:
  - project: 'World/Phosh/meta-phosh'
    ref: '5dc236ce724a53282339ebb362639577b7ad3cdf'
    file: '/ci/phosh-common-jobs.yml'
  - project: 'Infrastructure/freedesktop-ci-templates'
    ref: 'd03cddbcff35f26861429fc816c00323f48e99af'
    file: '/templates/ci-fairy.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # Don't trigger a branch pipeline if there is an open MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  # Protect CI infra from rogue jobs
  timeout: 15 minutes
  # Allow jobs to be caneled on new commits
  interruptible: true
  # Retry on infra hickups automatically
  retry:
    max: 1
    when:
      - 'api_failure'
      - 'runner_system_failure'
      - 'scheduler_failure'
      - 'stuck_or_timeout_failure'

image: debian:testing

before_script:
  - apt-get update -y
  - apt-get install -y build-essential rustup
  - apt -y build-dep .
  - rustup default stable
  - rustup toolchain install nightly
  - rustup component add clippy rustfmt

stages:
  - build
  - test
  - style-checks
  - package

lint:
  stage: test
  script:
    - meson setup build -Ddemo=true
    - CARGO_HOME=build/cargo cargo +nightly fmt --all --check
    - CARGO_HOME=build/cargo cargo clippy --target-dir build/target --workspace --no-deps -- -D warnings

build:
  stage: build
  script:
    - meson setup build -Ddemo=true -Dbuildtype=release
    - meson compile -C build
  artifacts:
    paths:
      - build/phosh-syncbus/phosh-syncbus
      - build/phosh-os-updater/phosh-os-updater
      - build/demo/phosh-syncbus-demo

check-meson:
  stage: style-checks
  extends:
    - .phosh-check-meson

check-consistency:
  stage: test
  extends: .phosh-check-consistency

package:deb-debian-forky:
  before_script: []
  stage: package
  extends: .phosh-build-debian-package
